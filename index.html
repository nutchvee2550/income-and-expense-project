<!doctype html>
<html lang="th">
  <head>
  
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>กระเป๋าเงินของฉัน</title>

    <!-- Tailwind CSS CDN -->
    <link href="./src/output.css" rel="stylesheet">

    <!-- FontAwesome CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- Google Font: Prompt -->
    <link
      href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: 'Prompt', sans-serif;
      }

      /* 🟢 บังคับขอบมนให้ Pop-up SweetAlert2 */
      div.swal2-container div.swal2-popup {
        border-radius: 2rem !important;
        padding: 1.75rem !important;
      }

      /* 🟢 บังคับขอบมนให้ปุ่มกดทุกปุ่ม (รวมปุ่มยกเลิกด้วย) */
      div.swal2-container button.swal2-styled,
      div.swal2-container button.swal2-confirm,
      div.swal2-container button.swal2-cancel {
        border-radius: 0.875rem !important;
        padding: 0.625rem 1.5rem !important;
        font-weight: 600 !important;
      }
    </style>
  </head>
  <body class="bg-white text-slate-800 min-h-screen antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
